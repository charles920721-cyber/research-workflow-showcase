<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研究工作流程管理系統(測試版)</title>
  <base href="./">
  <link rel="stylesheet" href="./static/css/gate.css">
</head>
<body>
  <div class="gate-page">
    <div class="gate-hero">
      <h1>研究工作流程管理系統(測試版)</h1>
      <p>請選擇進入方式</p>
    </div>

    <div class="gate-options">
      <button type="button" class="gate-card" id="guestBtn">
        <span class="gate-title">訪客模式</span>
        <span class="gate-desc">瀏覽工作流程與研究內容，無法編輯</span>
      </button>

      <div class="gate-card gate-card-form" id="loginCard">
        <span class="gate-title">登入帳號</span>
        <span class="gate-desc">使用帳號密碼登入，可編輯網站內容</span>
        <form id="loginForm" class="gate-login-form">
          <input type="text" id="loginUsername" placeholder="帳號" autocomplete="username" required>
          <input type="password" id="loginPassword" placeholder="密碼" autocomplete="current-password" required>
          <button type="submit" class="btn btn-primary">登入並進入</button>
          <p class="gate-error" id="loginError"></p>
        </form>
      </div>
    </div>
  </div>

  <script src="./static/js/api-shim.js" data-showcase-base="./"></script>
  <script src="./static/js/gate.js"></script>
</body>
</html>
